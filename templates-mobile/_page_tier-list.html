<!-- ::: PAGE FRAGMENT ::: -->
<style>
  /* Mobile tier-list — neubrutalist. Tier groups = vivid label block + sharp
     hero cards; Full table = horizontal-scroll grid with sticky hero column +
     sticky header so EVERY mode column stays reachable on a phone.
     Generated HTML class names match the (reused) page script. */

  .page-tier-list .tier-row {
    display: grid; grid-template-columns: 56px 1fr;
    border: var(--border-w) solid var(--border);
    background: var(--panel); margin-bottom: 12px; box-shadow: var(--shadow-sm);
  }
  .page-tier-list .tier-row .tier-label {
    display: grid; place-items: center;
    font-family: var(--font-display); font-size: 24px; color: var(--ink);
    background: var(--tier-color, var(--panel-strong));
    border-right: var(--border-w) solid var(--border);
  }
  .page-tier-list .tier-row .tier-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 8px; padding: 8px;
  }
  /* View Danh sách dùng lại đúng khung .tier-row, chỉ khác: ô trái là CHỮ CÁI
     đầu tên hero (mốc để dò), không phải bậc tier. */
  .page-tier-list .letter-row .tier-label { font-size: 20px; background: var(--panel-strong) }
  .page-tier-list .tier-row .empty {
    display: grid; place-items: center;
    color: var(--muted); padding: 16px; font-style: italic; font-size: 13px;
  }

  .page-tier-list .card {
    cursor: pointer; display: flex; flex-direction: column; align-items: center;
    text-align: center; position: relative;
  }
  .page-tier-list .card:focus-visible,
  .page-tier-list .row-portrait:focus-visible {
    outline: 3px solid var(--primary); outline-offset: 2px;
  }
  .page-tier-list .card .portrait {
    width: 100%; aspect-ratio: 1 / 1; overflow: hidden; position: relative;
    background: var(--panel-soft);
    border: var(--border-w) solid var(--border); margin-bottom: 5px;
  }
  /* Chip tier góc trái ảnh — chỉ dùng ở view Danh sách (nơi không còn dải tier
     bên trái để biết hero thuộc bậc nào). */
  .page-tier-list .card .tbadge {
    position: absolute; top: 0; left: 0; z-index: 1;
    font-family: var(--font-mono); font-size: 10px; font-weight: 700; line-height: 1;
    color: var(--ink); padding: 3px 4px;
    background: var(--tier-color, var(--panel-strong));
    border-right: 2px solid var(--border); border-bottom: 2px solid var(--border);
  }
  .page-tier-list .card .portrait img { width: 100%; height: 100%; object-fit: cover; display: block }
  .page-tier-list .card .portrait .initials {
    width: 100%; height: 100%; display: grid; place-items: center;
    font-family: var(--font-display); font-size: 22px; color: var(--ink);
    background: var(--tier-color, var(--panel-strong));
  }
  .page-tier-list .card .name {
    font-size: 11.5px; font-weight: 600; line-height: 1.2; min-height: 28px;
    color: var(--ink);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }

  /* ---- Full table: dense, fully scrollable ---- */
  .page-tier-list .tableview {
    background: var(--panel); border: var(--border-w) solid var(--border);
    overflow: auto; max-height: calc(100dvh - var(--appbar-h) - var(--nav-h) - 150px);
    min-height: 300px; -webkit-overflow-scrolling: touch;
  }
  .page-tier-list table.t {
    width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px;
  }
  .page-tier-list table.t th, .page-tier-list table.t td {
    padding: 7px 6px; border-bottom: 2px solid var(--border);
    text-align: center; white-space: nowrap;
  }
  .page-tier-list table.t thead th {
    position: sticky; background: var(--ink); color: var(--on-dark);
    font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
    z-index: 4;
  }
  .page-tier-list table.t thead th { top: 0 }
  .page-tier-list table.t thead th:first-child { left: 0; z-index: 6 }
  .page-tier-list table.t td.name-cell {
    text-align: left; padding-left: 8px;
    position: sticky; left: 0; background: var(--panel); z-index: 1;
    border-right: var(--border-w) solid var(--border);
    /* Notes sống chung cell với icon nên cell phải wrap và ăn hết phần dư. */
    white-space: normal; width: 100%; vertical-align: top;
  }
  .page-tier-list table.t .hero-cell { display: flex; align-items: flex-start; gap: 8px }
  /* Cột trái của cell Hero: avatar + điểm + 2 tier (WA+Foggy, Arena+Ygg) xếp dọc,
     luôn hiện nên không còn 3 cột điểm riêng nữa. */
  .page-tier-list table.t .hero-meta {
    display: flex; flex-direction: column; gap: 3px; width: 56px; flex-shrink: 0;
  }
  .page-tier-list table.t .tier-pair { display: flex; gap: 3px }
  .page-tier-list table.t .hero-note {
    font-size: 14px; line-height: 1.4; color: var(--body-color); flex: 1; min-width: 0;
    /* anywhere ⇒ min-content của cell về 0, bảng không bị từ dài nong ra quá viewport */
    overflow-wrap: anywhere;
    /* Không clamp: note hiện đủ, hàng cao theo nội dung (ẩn 3 cột điểm là để
       dành chỗ cho đúng chuyện này). */
  }
  .page-tier-list table.t tr:nth-child(even) td { background: var(--panel-soft) }
  .page-tier-list table.t tr:nth-child(even) td.name-cell { background: var(--panel-soft) }
  .page-tier-list table.t .row-portrait { display: block; cursor: pointer }
  .page-tier-list table.t .row-portrait img,
  .page-tier-list table.t .row-portrait .initials-sm {
    width: 56px; height: 56px; object-fit: cover;
    background: var(--panel-soft); border: var(--border-w) solid var(--border);
    display: grid; place-items: center; font-family: var(--font-display); font-size: 18px;
    color: var(--ink);
  }
  .page-tier-list table.t td .tier-chip {
    display: block; flex: 1; padding: 2px 3px; text-align: center;
    border: 2px solid var(--border);
    font-weight: 700; font-size: 11px; color: var(--ink); line-height: 1.2;
    font-family: var(--font-mono);
  }
  .page-tier-list table.t td .tier-chip.empty {
    background: var(--panel-strong); color: var(--muted); border-style: dashed; font-family: var(--font-sans);
  }
  .page-tier-list table.t th.sortable { cursor: pointer; user-select: none }
  .page-tier-list table.t th.sortable::after { content: "↕"; opacity: .5; margin-left: 3px }
  .page-tier-list table.t th.sort-asc::after  { content: "▲"; opacity: 1; color: var(--c-amber) }
  .page-tier-list table.t th.sort-desc::after { content: "▼"; opacity: 1; color: var(--c-amber) }
</style>

<section class="page page-tier-list" data-tab="tier-list" hidden>
  <div class="page-wrap">
    <div class="controls">
      <div class="seg" id="tl-view-seg">
        <button data-view="tier" class="active">Tier groups</button>
        <button data-view="table">Full table</button>
        <button data-view="list" title="Toàn bộ hero xếp A → Z, không chia tier">Danh sách</button>
      </div>
      <!-- Mode = 3 nút switch nhanh (trước là <select>): Overall + 2 mode PVP.
           Nút thứ 2/3 dựng từ COLUMNS trong initOnce nên đổi VISIBLE_KEYS là
           thanh nút đổi theo, không phải sửa markup. -->
      <div class="seg" id="tl-mode-seg" role="group" aria-label="Tier hiển thị theo mode nào">
        <button data-mode="overall" class="active" title="Điểm tổng hợp">Overall</button>
      </div>
      <span class="count" id="tl-count"></span>
    </div>

    <main id="tl-tier-view"></main>
    <section id="tl-list-view" hidden></section>
    <section id="tl-table-view" class="tableview" hidden></section>
  </div>
</section>

<script type="application/json" id="data-tier-list">__TIER_LIST_DATA__</script>

<!-- ::: PAGE SCRIPT ::: -->
<script>
(() => {
  const SLUG = 'tier-list';
  const ROOT = document.querySelector('.page-tier-list');
  const DATA = JSON.parse(document.getElementById('data-tier-list').textContent);

  // Chỉ hiển thị 2 mode PVP; data JSON vẫn giữ đủ 14 cột từ sheet.
  const VISIBLE_KEYS = new Set(['wa_foggy', 'arena_ygg']);
  const COLUMNS = DATA.columns.filter(c => VISIBLE_KEYS.has(c.key));

  const TIER_BANDS = [
    { id: "SS", label: "SS", colorVar: "--t-ss" },
    { id: "S+", label: "S+", colorVar: "--t-sp" },
    { id: "S",  label: "S",  colorVar: "--t-s"  },
    { id: "S-", label: "S-", colorVar: "--t-sm" },
    { id: "A+", label: "A+", colorVar: "--t-ap" },
    { id: "A",  label: "A",  colorVar: "--t-a"  },
    { id: "A-", label: "A-", colorVar: "--t-am" },
    { id: "B",  label: "B",  colorVar: "--t-b"  },
    { id: "C",  label: "C",  colorVar: "--t-c"  },
    { id: "D",  label: "D",  colorVar: "--t-d"  },
  ];

  function getCssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  const TIER_COLOR = Object.fromEntries(TIER_BANDS.map(t => [t.id, getCssVar(t.colorVar)]));
  function tierColor(t) { return TIER_COLOR[t] || getCssVar('--t-na'); }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function initials(name) {
    const parts = (name || '').trim().split(/\s+/);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  let initialized = false;
  let state = { view: 'tier', mode: 'overall', hero: '' };
  let sortState = { key: 'overall', dir: 'desc' };

  const byName = (a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' });

  function isActive() { return Omni.getActivePage() === SLUG; }

  function readState() {
    if (!isActive()) return;
    const h = Omni.readPageHash();
    state = {
      view: (h.view === 'table' || h.view === 'list') ? h.view : 'tier',
      mode: VISIBLE_KEYS.has(h.mode) ? h.mode : 'overall',
      hero: h.hero || '',
    };
  }
  function syncHash() {
    if (!isActive()) return;
    const out = {};
    if (state.view !== 'tier') out.view = state.view;
    if (state.mode !== 'overall') out.mode = state.mode;
    if (state.hero) out.hero = state.hero;
    Omni.writePageHash(SLUG, out);
  }

  function heroTierFor(h, mode) {
    if (mode === 'overall') return h.overall_band || '';
    return h.tiers[mode] || '';
  }

  const tierViewEl = ROOT.querySelector('#tl-tier-view');
  const listViewEl = ROOT.querySelector('#tl-list-view');
  const tableViewEl = ROOT.querySelector('#tl-table-view');
  const countEl = ROOT.querySelector('#tl-count');

  function renderTier() {
    const buckets = Object.fromEntries(TIER_BANDS.map(b => [b.id, []]));
    for (const h of DATA.heroes) {
      const t = heroTierFor(h, state.mode);
      if (!buckets[t]) buckets[t] = [];
      buckets[t].push(h);
    }
    countEl.textContent = `${DATA.heroes.length} hero`;

    let html = '';
    for (const band of TIER_BANDS) {
      const list = buckets[band.id] || [];
      const tcol = tierColor(band.id);
      html += `<div class="tier-row" style="--tier-color:${tcol}">
        <div class="tier-label">${band.label}</div>
        <div class="tier-grid">`;
      if (!list.length) {
        html += `<div class="empty">— no hero —</div>`;
      } else {
        list.sort((a, b) => (b.overall || 0) - (a.overall || 0));
        for (const h of list) {
          html += cardHTML(h, band.id);
        }
      }
      html += `</div></div>`;
    }
    tierViewEl.innerHTML = html;
  }

  function cardHTML(h, bandId, showTier) {
    const tcol = tierColor(bandId);
    const portrait = h.image
      ? `<img loading="lazy" src="${escapeHtml(h.image)}" alt="${escapeHtml(h.name)}"
            onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'initials',textContent:'${escapeHtml(initials(h.name))}'}))">`
      : `<div class="initials">${escapeHtml(initials(h.name))}</div>`;
    const badge = showTier
      ? `<span class="tbadge" title="${escapeHtml(bandId || 'chưa xếp hạng')}">${escapeHtml(bandId || '–')}</span>`
      : '';
    return `<div class="card" data-name="${escapeHtml(h.name)}" role="button" tabindex="0" aria-label="${escapeHtml(h.name)}" style="--tier-color:${tcol}">
      <div class="portrait">${badge}${portrait}</div>
      <div class="name">${escapeHtml(h.name)}</div>
    </div>`;
  }

  // View "Danh sách": TOÀN BỘ hero xếp A→Z, không chia bậc tier. Chữ cái đầu
  // làm mốc dò tên; tier của mode đang chọn vẫn hiện dưới dạng chip trên ảnh.
  function renderList() {
    const rows = DATA.heroes.slice().sort(byName);
    countEl.textContent = `${rows.length} hero`;

    const groups = new Map();
    for (const h of rows) {
      const first = (h.name.trim()[0] || '').toUpperCase();
      const key = /[A-Z]/.test(first) ? first : '#';   // tên bắt đầu bằng số/ký tự lạ
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(h);
    }

    let html = '';
    for (const [letter, list] of groups) {
      const cards = list.map(h => cardHTML(h, heroTierFor(h, state.mode), true)).join('');
      html += `<div class="tier-row letter-row">
        <div class="tier-label">${escapeHtml(letter)}</div>
        <div class="tier-grid">${cards}</div>
      </div>`;
    }
    listViewEl.innerHTML = html;
  }

  function renderTable() {
    const rows = DATA.heroes.slice();
    countEl.textContent = `${rows.length} hero`;

    const { key, dir } = sortState;
    const orderMap = Object.fromEntries(DATA.tier_order.map((t, i) => [t, i]));
    const cmp = (a, b) => {
      let av, bv;
      if (key === 'name') { av = a.name.toLowerCase(); bv = b.name.toLowerCase(); }
      else if (key === 'overall') { av = a.overall ?? -1; bv = b.overall ?? -1; }
      else {
        av = orderMap[a.tiers[key]] ?? 999;
        bv = orderMap[b.tiers[key]] ?? 999;
      }
      if (av < bv) return dir === 'asc' ? -1 : 1;
      if (av > bv) return dir === 'asc' ? 1 : -1;
      return 0;
    };
    rows.sort(cmp);

    const sortMark = k => k === sortState.key ? (sortState.dir === 'asc' ? 'sort-asc' : 'sort-desc') : '';

    // Chỉ còn 1 cột: điểm + 2 tier nằm ngay dưới avatar trong cell Hero, nên
    // bảng không cần cột riêng (và không cần nút bật/tắt) nữa.
    let html = `<table class="t"><thead>
      <tr>
        <th class="sortable ${sortMark('name')}" data-sort="name" style="text-align:left;padding-left:8px">Hero</th>
      </tr>
    </thead><tbody>`;

    const tierChip = t => `<span class="tier-chip ${t ? '' : 'empty'}"
      style="${t ? `background:${tierColor(t)}` : ''}"
      title="${escapeHtml(t || 'chưa xếp hạng')}">${escapeHtml(t || '–')}</span>`;

    for (const h of rows) {
      const port = h.image
        ? `<img loading="lazy" src="${escapeHtml(h.image)}" alt=""
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'initials-sm',textContent:'${escapeHtml(initials(h.name))}'}))">`
        : `<div class="initials-sm">${escapeHtml(initials(h.name))}</div>`;
      // Note hiện đủ (không clamp) nên title= chỉ lặp lại y hệt phần nhìn thấy.
      const note = h.notes ? `<span class="hero-note">${escapeHtml(h.notes)}</span>` : '';
      const score = h.overall != null
        ? `<span class="tier-chip" style="background:${tierColor(h.overall_band)}" title="Overall ${h.overall.toFixed(2)}">${h.overall.toFixed(2)}</span>`
        : `<span class="tier-chip empty" title="chưa có điểm">–</span>`;
      // Thứ tự chip cố định theo COLUMNS: trái = WA + Foggy, phải = Arena + Ygg.
      const pair = COLUMNS.map(c => tierChip(h.tiers[c.key] || '')).join('');
      html += `<tr><td class="name-cell">
        <span class="hero-cell">
          <span class="hero-meta">
            <span class="row-portrait" data-name="${escapeHtml(h.name)}" role="button" tabindex="0" aria-label="${escapeHtml(h.name)}">${port}</span>
            ${score}
            <span class="tier-pair">${pair}</span>
          </span>
          ${note}
        </span>
      </td></tr>`;
    }

    html += `</tbody></table>`;
    tableViewEl.innerHTML = html;
  }

  function render() {
    if (state.view === 'tier') renderTier();
    else if (state.view === 'list') renderList();
    else renderTable();
  }

  function openHero(name) {
    if (!Omni.openProfile(name)) return;
    state.hero = name;
    syncHash();
  }

  function applyState() {
    for (const b of ROOT.querySelectorAll('#tl-view-seg button')) {
      b.classList.toggle('active', b.dataset.view === state.view);
    }
    for (const b of ROOT.querySelectorAll('#tl-mode-seg button')) {
      const on = b.dataset.mode === state.mode;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on);
    }
    tierViewEl.hidden = state.view !== 'tier';
    listViewEl.hidden = state.view !== 'list';
    tableViewEl.hidden = state.view !== 'table';
    // Mode switch có nghĩa ở view tier (chia bậc) và view danh sách (chip tier
    // trên mỗi hero); bảng đã hiện sẵn cả 2 mode nên không cần.
    ROOT.querySelector('#tl-mode-seg').style.display = state.view === 'table' ? 'none' : '';
  }

  function initOnce() {
    if (initialized) return;
    initialized = true;

    const modeSeg = ROOT.querySelector('#tl-mode-seg');
    for (const col of COLUMNS) {
      const btn = document.createElement('button');
      btn.dataset.mode = col.key;
      // Nhãn ngắn (chỉ label) để 3 nút vừa một hàng trên điện thoại; tên nhóm
      // đầy đủ ("Seasonal Content · …") nằm ở title.
      btn.textContent = col.label;
      btn.title = `${col.group ? col.group + ' · ' : ''}${col.label}`;
      modeSeg.appendChild(btn);
    }

    modeSeg.addEventListener('click', e => {
      const btn = e.target.closest('button[data-mode]');
      if (!btn || btn.dataset.mode === state.mode) return;
      state.mode = btn.dataset.mode;
      applyState();
      syncHash();
      render();
    });
    ROOT.querySelector('#tl-view-seg').addEventListener('click', e => {
      const btn = e.target.closest('button[data-view]');
      if (!btn) return;
      state.view = btn.dataset.view;
      applyState();  // một chỗ duy nhất lo class active + hidden của controls
      syncHash();
      render();
    });
    ROOT.addEventListener('click', e => {
      const opener = e.target.closest('.card, .row-portrait');
      if (opener && opener.dataset.name) {
        openHero(opener.dataset.name);
        return;
      }
      const th = e.target.closest('th.sortable');
      if (th) {
        const k = th.dataset.sort;
        if (sortState.key === k) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
        else { sortState.key = k; sortState.dir = k === 'name' ? 'asc' : 'desc'; }
        renderTable();
      }
    });
    ROOT.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const opener = e.target.closest('.card[data-name], .row-portrait[data-name]');
      if (opener) { e.preventDefault(); openHero(opener.dataset.name); }
    });
  }

  Omni.onTab(SLUG, () => {
    initOnce();
    readState();
    applyState();
    render();
    if (state.hero) openHero(state.hero);
  });

  Omni.onModalClosed(() => {
    if (state.hero) {
      state.hero = '';
      syncHash();
    }
  });
})();
</script>
