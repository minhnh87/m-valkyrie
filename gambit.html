<style>
  /* ============================================================
     Sacred Gambit Q&A — STANDALONE single-file page (gambit.html).
     Split out of the Omniheroes shell's "Others" tab: content only, no nav,
     no header, no footer. One job: the game asks a question, you type a few
     words, you read the answer.
     Same neubrutalist language as index.html, but only the tokens/primitives
     this page actually uses are copied here — it shares no CSS with the shell
     on purpose (separate file, separate build, rarely changes).
     ============================================================ */
  :root {
    --canvas: #f4f4f0;
    --panel: #ffffff;
    --panel-soft: #fbfbf8;
    --panel-strong: #ececE6;

    --ink: #0a0a0a;
    --body-color: #1d1d1b;
    --muted: #4a4a46;
    --muted-soft: #6f6f69;
    --on-dark: #ffffff;

    --border: #0a0a0a;
    --border-w: 2px;
    --shadow-sm: 3px 3px 0 #0a0a0a;
    --hairline-soft: #d7d7d1;

    --c-amber: #ffc400;
    --c-cyan: #00b8d4;
    --primary: #7c3aed;

    --font-display: "Russo One", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-sans: "Chakra Petch", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box }
  html, body { margin: 0; padding: 0 }
  html { -webkit-text-size-adjust: 100% }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    /* no bottom nav here — just breathing room past the iOS home indicator */
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  }
  a { color: var(--primary); text-underline-offset: 3px; font-weight: 600 }
  button { font-family: inherit }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important }
  }

  .page-wrap { padding: 12px 12px 24px }

  /* Shared controls primitives (copied from the shell — only what's used). */
  .controls {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin-bottom: 14px;
  }
  .search { position: relative; flex: 1 1 100%; min-width: 0 }
  .search input {
    width: 100%; background: var(--panel);
    border: var(--border-w) solid var(--border);
    color: var(--ink); padding: 11px 12px 11px 38px;
    font-family: var(--font-sans); font-size: 16px; font-weight: 500;
    outline: none;
  }
  .search input::placeholder { color: var(--muted-soft) }
  .search input:focus { box-shadow: var(--shadow-sm); border-color: var(--primary) }
  .search::before {
    content: "⌕"; position: absolute; left: 12px; top: 9px;
    font-size: 20px; color: var(--muted); line-height: 1;
  }
  .count {
    color: var(--ink); font-size: 12px; margin-left: auto;
    font-family: var(--font-mono); font-weight: 700;
    background: var(--c-amber); border: var(--border-w) solid var(--border);
    padding: 5px 9px; white-space: nowrap;
  }

  /* ── Sacred Gambit Q&A ───────────────────────────────────────────────────── */
  /* The search bar sticks to the top of the viewport while the list scrolls, so
     you can keep re-typing without scrolling back up. It bleeds past the
     .page-wrap padding (negative margins) so nothing shows through the gutters
     when cards slide under it. Never bottom-fix it: the virtual keyboard on
     mobile covers `position: fixed` bars. */
  .gm-bar {
    position: sticky; top: 0; z-index: 5;
    background: var(--canvas);
    padding: 10px 12px; margin: 0 -12px 12px;
    border-bottom: var(--border-w) solid var(--border);
  }
  /* Keep the input and the hit counter on ONE row — the shared .search rule is
     `flex: 1 1 100%`, which would wrap the counter and double the sticky bar's
     height (it eats scroll space on every screen). */
  .gm-bar .controls { margin-bottom: 0; flex-wrap: nowrap; gap: 6px }
  .gm-bar .search { flex: 1 1 auto }
  .gm-bar .count { margin-left: 0; font-size: 12px }

  /* Explicit Clear button — a real 44px+ tap target instead of WebKit's tiny
     native ✕ (which is also invisible on Android). Kept disabled rather than
     hidden while the box is empty so the row never reflows mid-typing.
     `.gm-start` (bottom of the list) fires the same reset, so it shares the
     look — it just spans the column instead of sitting in the sticky row. */
  .gm-clear, .gm-start {
    flex: 0 0 auto; min-height: 46px; padding: 0 13px;
    background: var(--ink); color: var(--on-dark);
    border: var(--border-w) solid var(--border); box-shadow: var(--shadow-sm);
    font-family: var(--font-display); font-size: 12.5px;
    text-transform: uppercase; letter-spacing: 0.4px; line-height: 1;
    cursor: pointer; white-space: nowrap;
    transition: background-color .12s ease, color .12s ease;
  }
  .gm-clear:disabled {
    background: var(--panel); color: var(--muted-soft);
    box-shadow: none; cursor: default;
  }
  /* One clear affordance only. */
  .gm-bar input[type="search"]::-webkit-search-cancel-button {
    -webkit-appearance: none; appearance: none; display: none;
  }

  .gm-hint { font-size: 12px; line-height: 1.5; color: var(--muted); margin: 0 0 12px }
  .gm-hint a { font-weight: 600 }

  .qa-list { display: flex; flex-direction: column; gap: 10px }

  .qa {
    background: var(--panel);
    border: var(--border-w) solid var(--border); box-shadow: var(--shadow-sm);
    border-left: 6px solid var(--c-cyan);
    padding: 10px 11px;
  }
  .qa .q {
    font-size: 14.5px; line-height: 1.45; font-weight: 600; color: var(--ink);
    overflow-wrap: anywhere;
  }
  .qa .a {
    display: flex; align-items: baseline; gap: 7px; margin-top: 8px;
    padding-top: 8px; border-top: 1px dashed var(--hairline-soft);
  }
  .qa .a .lbl {
    font-family: var(--font-display); font-size: 10px; line-height: 1.4;
    text-transform: uppercase; letter-spacing: 0.06em;
    background: var(--c-amber); color: var(--ink);
    border: 2px solid var(--border); padding: 2px 6px;
    flex-shrink: 0; white-space: nowrap;
  }
  .qa .a .val {
    font-size: 15px; font-weight: 700; color: var(--ink);
    overflow-wrap: anywhere; min-width: 0;
  }

  /* Highlighted search hits — flat block, no rounded browser default. */
  .qa mark { background: var(--c-amber); color: var(--ink); padding: 0 1px; border-radius: 0 }

  .gm-empty {
    padding: 18px 12px; text-align: center; color: var(--muted);
    font-size: 13.5px; line-height: 1.6;
    border: var(--border-w) dashed var(--border); background: var(--panel-soft);
  }

  /* "Start here" — the end-of-list twin of Clear: after scrolling through the
     hits you're at the bottom, so this resets the query and takes you back to
     the search box without a long scroll up. Always enabled (unlike Clear):
     its job is the trip back to the top, empty query or not. */
  .gm-start { display: block; width: 100%; margin-top: 14px }

<script>
(() => {
  const GAMBIT = JSON.parse(document.getElementById('data-gambit').textContent);

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // A flat Q + A list with one job: type a few words from the question the game
  // just asked and read the answer. Matching ignores case and accents, and every
  // token must appear somewhere in "question + answer".
  function fold(s) {
    return (s || '').replace(/đ/g, 'd').replace(/Đ/g, 'D')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  // Same folding, but per character, so we keep a map from each folded offset
  // back to the offset in the ORIGINAL text — that's what lets us highlight the
  // untouched string after matching against the folded one.
  function foldIndex(s) {
    let norm = '';
    const map = [];
    for (let i = 0; i < s.length; i++) {
      const f = fold(s[i]);
      for (let k = 0; k < f.length; k++) { norm += f[k]; map.push(i); }
    }
    map.push(s.length);
    return { norm, map };
  }

  function highlight(text, tokens) {
    if (!tokens.length) return escapeHtml(text);
    const { norm, map } = foldIndex(text);
    const ranges = [];
    for (const t of tokens) {
      let from = 0, i;
      while ((i = norm.indexOf(t, from)) !== -1) {
        ranges.push([map[i], map[i + t.length]]);
        from = i + t.length;
      }
    }
    if (!ranges.length) return escapeHtml(text);
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const r of ranges) {
      const last = merged[merged.length - 1];
      if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
      else merged.push([r[0], r[1]]);
    }
    let out = '', pos = 0;
    for (const [s, e] of merged) {
      out += escapeHtml(text.slice(pos, s)) + '<mark>' + escapeHtml(text.slice(s, e)) + '</mark>';
      pos = e;
    }
    return out + escapeHtml(text.slice(pos));
  }

  // Search index, built once: folded "question + answer" per entry.
  const QA = (GAMBIT.items || []).map(it => ({
    q: it.q, a: it.a, hay: fold(it.q + ' ' + it.a),
  }));

  const input = document.getElementById('gm-q');
  const clearBtn = document.getElementById('gm-clear');
  const countEl = document.getElementById('gm-count');
  const listEl = document.getElementById('gm-list');
  const hintEl = document.getElementById('gm-hint');

  hintEl.innerHTML = `${QA.length} câu hỏi Sacred Gambit — không phân biệt hoa thường / dấu.
    <a href="${escapeHtml(GAMBIT.source || '#')}" target="_blank" rel="noopener">Nguồn sheet ↗</a>`;

  function render() {
    const query = input.value;
    const tokens = fold(query).split(/\s+/).filter(Boolean);
    const hits = tokens.length
      ? QA.filter(it => tokens.every(t => it.hay.includes(t)))
      : QA;

    countEl.textContent = `${hits.length}/${QA.length}`;
    clearBtn.disabled = query === '';

    if (!hits.length) {
      listEl.innerHTML = `<div class="gm-empty">Không tìm thấy câu nào khớp “${escapeHtml(query)}”.<br>Thử gõ ít chữ hơn, hoặc một từ khoá đặc trưng trong câu hỏi.</div>`;
      return;
    }
    listEl.innerHTML = hits.map(it => `<div class="qa">
        <div class="q">${highlight(it.q, tokens)}</div>
        <div class="a"><span class="lbl">Đáp án</span><span class="val">${highlight(it.a, tokens)}</span></div>
      </div>`).join('');
  }

  input.addEventListener('input', render);

  // Reset = wipe the query, jump back to the search box, show the full list.
  // Wired to both the sticky Clear button and the "Start here" button that
  // closes the list, so either end of the page starts a fresh lookup.
  function reset() {
    input.value = '';
    input.focus();                                   // clearing = about to retype
    window.scrollTo({ top: 0, behavior: 'auto' });   // back to the top of the full list
    render();
  }
  clearBtn.addEventListener('click', reset);
  document.getElementById('gm-start').addEventListener('click', reset);

  render();
})();
</script>
